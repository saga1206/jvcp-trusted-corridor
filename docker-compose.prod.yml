services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: jvcp
      POSTGRES_USER: jvcp
      POSTGRES_PASSWORD: jvcp_dev_pw
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file: .env
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    restart: unless-stopped
    command: npm run dev -- --host
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/staticfiles:/app/staticfiles:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres-data: